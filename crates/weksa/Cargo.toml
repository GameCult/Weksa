[package]
name = "weksa"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "weksa"
path = "src/lib.rs"

[[bin]]
name = "weksa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "64b86e0a273a3936939357e9deb186b7bf3bc417", package = "cultcache-rs" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
